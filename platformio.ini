; Configuração do PlatformIO para o projeto ESP32 + OLED + Reconhecimento facial no PC
; Documentação: https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Velocidade do Monitor Serial (igual ao Serial.begin no main.cpp)
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Velocidade de gravação pela USB
upload_speed = 921600

; Bibliotecas externas (o Wire.h já vem com o core do ESP32)
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.12.1
